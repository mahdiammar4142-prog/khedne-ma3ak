name: lebanon_places
description: Khedne Ma3ak - discover places, events, trip booking, and guides.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State & routing
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  # Auth & database
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.9
  cloud_functions: ^5.6.2
  shared_preferences: ^2.2.2
  # UI & forms
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # Social & chat
  uuid: ^4.2.2
  intl: ^0.19.0
  # Trip & booking (placeholder - integrate real APIs later)
  url_launcher: ^6.2.4
  # Maps - Lebanon (Google Maps)
  google_maps_flutter: ^2.5.3
  http: ^1.2.2
  # AI - Gemini (free tier)
  google_generative_ai: ^0.4.7
  # Env
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/pools_beaches.png
    - assets/images/restaurants.png
    - assets/images/sports_activities.png
    - assets/images/hotels_guesthouses.png
    - assets/
    - assets/logo.png
